name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Hermes source (editable; wheels unsupported)
        run: |
          git init "$RUNNER_TEMP/hermes-runtime"
          git -C "$RUNNER_TEMP/hermes-runtime" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-runtime" fetch --depth=1 origin f159e581c7afd22a5c94652c569e3859f1b994d2
          git -C "$RUNNER_TEMP/hermes-runtime" checkout --detach FETCH_HEAD
          python -m pip install -e "$RUNNER_TEMP/hermes-runtime"
      - name: Run tests
        run: ./scripts/test.sh
      - name: Install demo tooling
        run: npm ci --include=dev
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build and exercise real-plugin demo
        run: npm run demo:build && npm run test:browser
