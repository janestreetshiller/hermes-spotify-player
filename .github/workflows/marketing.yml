name: Spotify player marketing assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/plugin.js'
      - 'demo/**'
      - 'docs/media/**'
      - 'scripts/render-*.mjs'
      - '.github/workflows/marketing.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --include=dev
      - run: npx playwright install chromium
      - name: Ensure video encoder
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Build production-rendered fixture demo
        run: npm run demo:build
      - name: Render demo video and source-based poster
        run: npm run demo:media && npm run poster:render
      - name: Upload reviewable marketing package (not social publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spotify-player-marketing-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            docs/media/player-1.3-demo.mp4
            docs/media/player-1.3-product.png
            docs/media/player-1.3-social.png
            docs/media/retro-poster.png
            docs/media/retro-social.png
            docs/SOCIAL.md
            docs/PLAYER-CLEANUP.md
